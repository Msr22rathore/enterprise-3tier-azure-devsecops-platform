services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: enterprise-sql

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123!"

    ports:
      - "1433:1433"

    volumes:
      - sql_data:/var/opt/mssql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Your_strong_password123!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'Your_strong_password123!' -Q 'SELECT 1'"
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s


  backend-service:
    build:
      context: ./backend
      dockerfile: EnterpriseTask.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EnterpriseTasksDb;User Id=sa;Password=Your_strong_password123!;TrustServerCertificate=True"

      Database__ApplyMigrations: "true"

      Cors__AllowedOrigins__0: "http://localhost:4200"

    ports:
      - "8080:8080"

    depends_on:
      sqlserver:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend/enterprise-task-ui
      dockerfile: Dockerfile

    ports:
      - "4200:80"

    depends_on:
      - backend-service


volumes:
  sql_data: