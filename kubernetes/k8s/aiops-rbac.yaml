apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-remediator
  namespace: enterprise-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aiops-remediator
  namespace: enterprise-dev
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aiops-remediator
  namespace: enterprise-dev
subjects:
- kind: ServiceAccount
  name: aiops-remediator
  namespace: enterprise-dev
roleRef:
  kind: Role
  name: aiops-remediator
  apiGroup: rbac.authorization.k8s.io