apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: enterprise-app
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Database__ApplyMigrations: "false"
  AzureSql__UseManagedIdentity: "true"
  ConnectionStrings__DefaultConnection: "Server=tcp,sql-enterprises-dev.database.windows.net,1433;Initial Catalog=sqldb-enterprise-dev;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
  Cors__AllowedOrigins__0: "https://REPLACE_WITH_APP_DOMAIN"
