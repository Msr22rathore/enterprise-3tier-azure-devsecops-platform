apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-task-api
  namespace: enterprise-dev
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: enterprise-task-api
  template:
    metadata:
      labels:
        app: enterprise-task-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: enterprise-task-api

      containers:
        - name: api
          image: acraiopsdev2026.azurecr.io/enterprise-task-api:dev
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20